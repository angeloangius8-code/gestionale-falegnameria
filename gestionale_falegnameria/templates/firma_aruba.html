{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-md border border-slate-200">
    <div class="flex items-center space-x-3 mb-6 border-b pb-4">
        <i class="fa-solid fa-file-signature text-amber-600 text-3xl"></i>
        <div>
            <h2 class="text-xl font-bold text-slate-900">Firma Digitale Remota Aruba</h2>
            <p class="text-xs text-slate-500">Documento: {{ doc.tipo_doc }} n° {{ doc.numero_doc }}/{{ doc.anno }}</p>
        </div>
    </div>

    <form action="/firma_documento/{{ doc.id }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Username Firma Remota Aruba</label>
            <input type="text" name="aruba_user" required placeholder="es. 12345678@ARUBA" class="w-full p-2.5 border rounded-lg text-sm bg-slate-50">
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
            <input type="password" name="aruba_pass" required class="w-full p-2.5 border rounded-lg text-sm bg-slate-50">
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Codice OTP (dall'App Aruba OTP)</label>
            <input type="text" name="aruba_otp" required placeholder="123456" class="w-full p-2.5 border rounded-lg text-sm font-mono tracking-widest text-center text-lg bg-amber-50 border-amber-300">
        </div>

        <div class="pt-4 flex space-x-3">
            <a href="/documenti" class="w-1/2 text-center py-2.5 border rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100">Annulla</a>
            <button type="submit" class="w-1/2 bg-amber-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-amber-700 shadow-md transition">
                <i class="fa-solid fa-key mr-2"></i> Firma Ora
            </button>
        </div>
    </form>
</div>
{% endblock %}
