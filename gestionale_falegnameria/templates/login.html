<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Falegnameria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #1e293b; 
            color: #ffffff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .login-card { 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            padding: 32px; 
            width: 100%; 
            max-width: 380px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <h3 class="fw-bold mb-1">🪵 {% if azienda and azienda['nome_azienda'] %}{{ azienda['nome_azienda'] }}{% else %}Falegnameria{% endif %}</h3>
    <p class="text-secondary small mb-4">Inserisci il PIN per accedere al gestionale</p>

    {% if error %}
        <div class="alert alert-danger py-2 small mb-3">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
            <input type="password" name="pin" class="form-control text-center fs-3 fw-bold border-secondary" placeholder="****" maxlength="8" required autofocus style="letter-spacing: 4px;">
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Accedi</button>
    </form>
</div>

</body>
</html>
